<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web App Colors</title>
  <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════
       LEFT PANEL — Global Controls
       ════════════════════════════════════════════════════════════ -->
  <aside class="panel-left">
    <h1 data-i18n="app.title">Web App Colors</h1>
    <span class="version-tag" id="versionTag"></span>

    <!-- Row 1: Language + Font -->
    <div class="ctrl-row">
      <div class="control-group">
        <label data-i18n="label.language">Language</label>
        <segmented-control
          id="langSelect"
          values='["EN","ES","IT","FR","DE","RU","KO","JA","ZH"]'
          value="EN"
          columns="3"
        ></segmented-control>
      </div>
      <div class="control-group">
        <label data-i18n="label.font">Font</label>
        <segmented-control
          id="fontSelect"
          keys='["Digital-7","Orbitron","System"]'
          values='["Digital-7","Orbitron","System"]'
          data-i18n-values="font.digital7,font.orbitron,font.system"
          value="System"
          columns="1"
        ></segmented-control>
      </div>
    </div>

    <!-- Colour Palette (segmented control, 5 columns) -->
    <div class="control-group">
      <label data-i18n="label.palette">Color Palette</label>
      <segmented-control
        id="paletteSelect"
        columns="5"
      ></segmented-control>
    </div>

    <!-- Palette Tools: names + pickers + actions -->
    <div class="control-group" id="paletteMetaGroup">
      <label data-i18n="label.paletteTools">Palette Tools</label>
      <div class="meta-fields">
        <input class="meta-input" id="metaGems" type="text" placeholder="Gems" data-i18n-placeholder="placeholder.gems" />
        <input class="meta-input" id="metaNatural" type="text" placeholder="Natural" data-i18n-placeholder="placeholder.natural" />
        <input class="meta-input" id="metaFlower" type="text" placeholder="Flower" data-i18n-placeholder="placeholder.flower" />
        <input class="meta-input" id="metaBeverage" type="text" placeholder="Beverage" data-i18n-placeholder="placeholder.beverage" />
        <input class="meta-input" id="metaPigment" type="text" placeholder="Pigment" data-i18n-placeholder="placeholder.pigment" />
      </div>
    </div>

    <!-- Dynamic colour pickers (built from JS based on accent count) -->
    <div id="pickerContainer" class="picker-row"></div>

    <!-- Arc mode buttons -->
    <div class="control-group">
      <label data-i18n="label.arcMode">Arc Mode</label>
      <div class="mode-buttons">
        <button class="mode-btn active" id="btn-linear" data-mode="linear" data-i18n="arc.linear">Linear</button>
        <button class="mode-btn" id="btn-circle" data-mode="circle" data-i18n="arc.circle">Circle</button>
        <button class="mode-btn" id="btn-superellipse" data-mode="superellipse" data-i18n="arc.superellipse">Superellipse</button>
      </div>
    </div>

    <!-- Generation sliders -->
    <div class="control-group" id="gen-controls">
      <label data-i18n="label.genParams">Generation Parameters</label>
      <div class="slider-grid">
        <span class="slider-label" data-i18n="param.n">N</span>
        <input type="range" id="slider-n" min="5" max="20" value="12" step="1" class="range-slider" />
        <span class="slider-val" id="n-value">12</span>

        <span class="slider-label" data-i18n="param.m">M</span>
        <input type="range" id="slider-m" min="3" max="7" value="5" step="1" class="range-slider" />
        <span class="slider-val" id="m-value">5</span>

        <span class="slider-label" data-i18n="param.l">L</span>
        <input type="range" id="slider-l" min="3" max="7" value="7" step="1" class="range-slider" />
        <span class="slider-val" id="l-value">7</span>

        <span class="slider-label" data-i18n="param.lmin">L<sub>min</sub></span>
        <input type="range" id="slider-lmin" min="0.05" max="0.90" value="0.05" step="0.01" class="range-slider" />
        <span class="slider-val" id="lmin-value">0.05</span>

        <span class="slider-label" data-i18n="param.lmax">L<sub>max</sub></span>
        <input type="range" id="slider-lmax" min="0.10" max="1.00" value="0.95" step="0.01" class="range-slider" />
        <span class="slider-val" id="lmax-value">0.95</span>

        <span class="slider-label" id="power-label" data-i18n="param.power">Power</span>
        <input type="range" id="slider-power" min="0.5" max="8" value="1.5" step="0.5" class="range-slider" />
        <span class="slider-val" id="power-value">1.5</span>

        <span class="slider-label" data-i18n="param.sigmoid">Sigmoid</span>
        <input type="range" id="slider-sigmoid" min="0" max="5" value="3" step="0.1" class="range-slider" />
        <span class="slider-val" id="sigmoid-value">3.0</span>

        <span class="slider-label" data-i18n="param.accLight">Acc light</span>
        <input type="range" id="slider-accent-light" min="0.10" max="0.95" value="0.55" step="0.01" class="range-slider" />
        <span class="slider-val" id="accent-light-value">0.55</span>

        <span class="slider-label" data-i18n="param.accDark">Acc dark</span>
        <input type="range" id="slider-accent-dark" min="0.10" max="0.95" value="0.45" step="0.01" class="range-slider" />
        <span class="slider-val" id="accent-dark-value">0.45</span>

        <span class="slider-label" data-i18n="param.alertL">Alert L</span>
        <input type="range" id="slider-alert-l" min="0.10" max="0.95" value="0.55" step="0.01" class="range-slider" />
        <span class="slider-val" id="alert-l-value">0.55</span>

        <span class="slider-label" data-i18n="param.catL">Cat. L</span>
        <input type="range" id="slider-category-l" min="0.10" max="0.95" value="0.55" step="0.01" class="range-slider" />
        <span class="slider-val" id="category-l-value">0.55</span>
      </div>

      <!-- Toggle rows -->
      <div class="toggle-row">
        <span class="slider-label" data-i18n="label.preview">Preview</span>
        <div class="toggle-group">
          <button class="toggle-btn active" id="btn-preview-web" data-i18n="preview.web">Web</button>
          <button class="toggle-btn" id="btn-preview-mobile" data-i18n="preview.mobile">Mobile</button>
          <button class="toggle-btn" id="btn-preview-procedural" data-i18n="preview.procedural">Procedural</button>
          <button class="toggle-btn" id="btn-preview-swatches" data-i18n="preview.swatches">Swatches</button>
        </div>
      </div>
    </div>

    <!-- Save / Export / Reset -->
    <div class="meta-actions">
      <button class="action-btn" id="btnSavePalette" data-i18n="btn.save">Save</button>
      <button class="action-btn" id="btnExportPalette" data-i18n="btn.exportPalette">Export palette</button>
      <button class="action-btn" id="btnExportModules" data-i18n="btn.exportModules">Export modules</button>
      <button class="action-btn" id="btnResetPalette" data-i18n="btn.reset">Reset</button>
    </div>

    <!-- Info note (collapsible) -->
    <div class="info-note">
      <label class="disable-toggle">
        <input type="checkbox" id="infoNoteToggle" autocomplete="off" />
        <span data-i18n="label.infoNote">ⓘ Info</span>
      </label>
      <div class="info-note-text" id="infoNoteText">
        <p data-i18n-html="info.disclaimer"></p>
        <p data-i18n-html="info.fonts"></p>
        <p data-i18n-html="info.agate"></p>
      </div>
    </div>

    <div class="spacer"></div>
  </aside>

  <!-- ════════════════════════════════════════════════════════════
       RIGHT PANEL — 2×2 Variant Preview
       ════════════════════════════════════════════════════════════ -->
  <main class="panel-right" id="mainPanel">
    <div class="variant-grid" id="variantGrid"></div>
  </main>

  <!-- ════════════════════════════════════════════════════════════
       Scripts
       ════════════════════════════════════════════════════════════ -->
  <script type="module" src="js/components/segmented-control.js"></script>
  <script type="module" src="js/components/color-picker.js"></script>
  <script type="module" src="js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruvbox Color Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
    <div class="layout">
        <aside class="left-panel">
            <h1 class="project-title">Gruvbox Excolor</h1>
            <p class="project-subtitle">Colour palette explorer</p>
            <span class="git-tag">v1.0.0</span>

            <div class="controls">
                <div class="mode-buttons">
                    <button id="btn-raw" class="mode-btn active" data-mode="raw">Raw</button>
                    <button id="btn-linear" class="mode-btn" data-mode="linear">Linear</button>
                    <button id="btn-circle" class="mode-btn" data-mode="circle">Circle</button>
                    <button id="btn-superellipse" class="mode-btn" data-mode="superellipse">Superellipse</button>
                </div>

                <div class="gen-controls hidden" id="gen-controls">
                    <div class="ctrl-row">
                        <label>N = <span id="n-value">12</span></label>
                        <input type="range" id="slider-n" min="5" max="20" value="12" step="1">
                    </div>
                    <div class="ctrl-row">
                        <label>M = <span id="m-value">5</span></label>
                        <input type="range" id="slider-m" min="3" max="7" value="5" step="1">
                    </div>
                    <div class="ctrl-row">
                        <label>L = <span id="l-value">5</span></label>
                        <input type="range" id="slider-l" min="3" max="7" value="5" step="1">
                    </div>
                    <div class="ctrl-row">
                        <label>L<sub>min</sub> = <span id="lmin-value">0.05</span></label>
                        <input type="range" id="slider-lmin" min="0.05" max="0.90" value="0.05" step="0.01">
                    </div>
                    <div class="ctrl-row">
                        <label>L<sub>max</sub> = <span id="lmax-value">0.95</span></label>
                        <input type="range" id="slider-lmax" min="0.10" max="1.00" value="0.95" step="0.01">
                    </div>
                    <div class="ctrl-row hidden" id="power-control">
                        <label>Power = <span id="power-value">1.5</span></label>
                        <input type="range" id="slider-power" min="0.5" max="8" value="1.5" step="0.5">
                    </div>
                    <div class="ctrl-row">
                        <label>Sigmoid = <span id="sigmoid-value">3.0</span></label>
                        <input type="range" id="slider-sigmoid" min="0" max="5" value="3" step="0.1">
                    </div>
                    <div class="ctrl-row">
                        <label>Accent light = <span id="accent-light-value">0.55</span></label>
                        <input type="range" id="slider-accent-light" min="0.10" max="0.95" value="0.55" step="0.01">
                    </div>
                    <div class="ctrl-row">
                        <label>Accent dark = <span id="accent-dark-value">0.45</span></label>
                        <input type="range" id="slider-accent-dark" min="0.10" max="0.95" value="0.45" step="0.01">
                    </div>
                    <div class="ctrl-row">
                        <label>Alert L = <span id="alert-l-value">0.55</span></label>
                        <input type="range" id="slider-alert-l" min="0.10" max="0.95" value="0.55" step="0.01">
                    </div>
                    <div class="ctrl-row">
                        <label>Category L = <span id="category-l-value">0.55</span></label>
                        <input type="range" id="slider-category-l" min="0.10" max="0.95" value="0.55" step="0.01">
                    </div>
                    <div class="ctrl-row">
                        <label>Expand categories</label>
                        <div class="toggle-group">
                            <button class="toggle-btn active" id="btn-expand-off">Off</button>
                            <button class="toggle-btn" id="btn-expand-on">On</button>
                        </div>
                    </div>
                    <div class="ctrl-row">
                        <label>Preview</label>
                        <div class="toggle-group">
                            <button class="toggle-btn active" id="btn-preview-swatches">Swatches</button>
                            <button class="toggle-btn" id="btn-preview-layout">Layout</button>
                        </div>
                    </div>
                    <div class="ctrl-row" style="margin-top:1rem">
                        <button class="export-btn" id="btn-export">Export JSON</button>
                    </div>
                </div>
            </div>
        </aside>
        <main class="right-panel">
            <div class="charts-grid" id="charts-grid">
                <div class="chart-container">
                    <canvas id="chart-neutral-id-l"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="chart-neutral-h-c"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="chart-colors-id-l"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="chart-colors-h-c"></canvas>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
